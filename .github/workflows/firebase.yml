name: Deploy to Firebase Hosting

# Runs alongside the Pages deploy rather than replacing it. The live site keeps
# working until Firebase is verified; removing pages.yml is a separate, later
# decision once a domain is pointed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.FIREBASE_PROJECT_ID != ''
    env:
      # Whether the secret exists, as a plain string. The `secrets` context is
      # not available in a job-level `if`, only in a step's, so the deploy step
      # below is what actually gets guarded. This exposes only emptiness, never
      # the value.
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # Deliberately no PAGES_BASE. Firebase serves from the root, so `base`
      # falls back to '/'. Setting the Pages prefix here would point every
      # asset URL at /Song-Game/ on a host that has no such path.
      - run: npm run build

      # Guarded because the project id alone is not enough to deploy. An
      # earlier version checked only that, so a repo holding the variable but
      # not the secret ran everything and then died here on "Input required
      # and not supplied: firebaseServiceAccount", reddening every push
      # through setup — the opposite of lying dormant until wired up.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
