name: Fetch song previews

# The catalogue ships as metadata only; this fills in preview URLs from the
# iTunes Search API and commits the result. Runs on a GitHub runner because
# the lookup needs open outbound network.
on:
  # workflow_dispatch only registers once this file reaches the default branch,
  # so a push trigger is what actually runs it on a feature branch. A push made
  # by GITHUB_TOKEN does not start another run, so committing the catalogue back
  # cannot loop; the path filter keeps it off unrelated commits regardless.
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/previews.yml'
      - 'scripts/fetch-previews.mjs'
  workflow_dispatch:
    inputs:
      country:
        description: 'Store fronts to walk, space separated. Blank walks them all.'
        required: false
        # Deliberately blank. A non-empty default here silently defeats the
        # `|| ...` fallback below, because `inputs.country` is then always set:
        # every manual run searched Saudi alone while the logs and the step's
        # own comment claimed it was walking five store fronts.
        default: ''
      sources:
        description: 'Where to look, space separated. Blank means iTunes then Deezer.'
        required: false
        default: ''
      catalogue:
        description: 'Which file to fill: songs, spacetoon, english.'
        required: false
        default: 'songs'
      min_artist:
        description: 'Artist floor 0..1. Lower it for cartoon themes, whose credits are unreliable.'
        required: false
        default: ''
      force:
        description: 'Re-fetch songs that already have a preview'
        type: boolean
        required: false
        default: false
  # Preview URLs expire; refresh weekly. Scheduled runs only fire on the
  # default branch, so this takes effect once the work is merged.
  schedule:
    - cron: '0 4 * * 1'

# Two runs both committing the catalogue would race and the loser's push would
# be rejected, so they queue rather than overlap.
concurrency:
  group: previews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # type stripping, so the script can import search.ts
          cache: npm

      - run: npm ci

      - name: Look up previews
        run: |
          # Without --force a pass only fills gaps, so walking several store
          # fronts widens coverage: a song missing from one country's catalogue
          # is often present in another. --force applies to the first pass only,
          # otherwise each later pass would overwrite the one before it.
          FORCE="${{ inputs.force && '--force' || '' }}"
          SOURCES="${{ inputs.sources || 'itunes deezer' }}"
          FILE="src/data/${{ inputs.catalogue || 'songs' }}.json"
          MINA="${{ inputs.min_artist && format('--min-artist {0}', inputs.min_artist) || '' }}"
          test -f "$FILE" || { echo "no such catalogue: $FILE"; exit 1; }
          echo "catalogue: $FILE"

          case "$SOURCES" in *itunes*)
            for front in ${{ inputs.country || 'SA EG AE KW LB US' }}; do
              echo "── iTunes store front: $front"
              node scripts/fetch-previews.mjs --in "$FILE" --source itunes --country "$front" $MINA $FORCE
              FORCE=""
            done
          esac

          # Deezer has no store fronts, so one pass is the whole catalogue —
          # and by here it only ever sees what Apple could not find anywhere.
          case "$SOURCES" in *deezer*)
            echo "── Deezer"
            node scripts/fetch-previews.mjs --in "$FILE" --source deezer $MINA $FORCE
          esac

      - name: Verify the catalogue still builds
        run: npm test && npm run build

      - name: Report coverage
        run: |
          node -e "
            const s = require('./src/data/songs.json');
            const withUrl = s.filter(x => x.previewUrl).length;
            console.log(\`previews: \${withUrl}/\${s.length}\`);
            const missing = s.filter(x => !x.previewUrl).map(x => x.id);
            if (missing.length) console.log('missing:', missing.join(', '));
          "

      - name: Commit the catalogue
        run: |
          if git diff --quiet src/data/songs.json; then
            echo "No change to the catalogue."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/songs.json
          git commit -m "Update song previews from iTunes"

          # Any push to this branch while the lookup ran leaves the runner
          # behind, and a plain push is then rejected — throwing away ten
          # minutes of rate-limited API work. Rebase onto whatever landed and
          # retry; only the catalogue file is touched, so there is nothing to
          # conflict with.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              echo "Catalogue pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          echo "::error::Could not push the catalogue after 3 attempts."
          exit 1

      # Last on purpose. This ran before the commit, so one unreachable URL
      # threw away the whole lookup: the step failed, the commit was skipped,
      # and a run that had just matched 30 songs saved none of them. A dead
      # link should still fail the run — loudly — but after the work is kept.
      - name: Check every preview URL actually resolves
        run: |
          # A matched URL is not a working one — previews expire, and a dead
          # link is indistinguishable from a broken game.
          node -e "
            const files = ['songs', 'spacetoon', 'english'];
            const songs = files.flatMap(f => require('./src/data/' + f + '.json')).filter(s => s.previewUrl);
            let bad = 0;
            (async () => {
              for (const s of songs) {
                // Not every CDN answers HEAD — Deezer's may not — so a refusal
                // is retried as a one-byte ranged GET before calling it dead.
                let res = await fetch(s.previewUrl, { method: 'HEAD' }).catch(e => ({ ok: false, status: e.message }));
                if (!res.ok) {
                  res = await fetch(s.previewUrl, { headers: { Range: 'bytes=0-0' } })
                    .catch(e => ({ ok: false, status: e.message }));
                }
                if (!res.ok) { bad++; console.log('DEAD  ' + s.id + '  ' + res.status + '  ' + (s.matchedAs?.source || 'itunes')); }
              }
              console.log(\`\${songs.length - bad}/\${songs.length} preview URLs reachable\`);
              if (bad) process.exit(1);
            })();
          "
